<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>


    <div id="header"></div>

    <div id="taskBar">

    </div>


    <div id="sidebar">




        <div id="tasks">

            <div id="all-tasks">
                <a href="#" id="all-tasks-link">All tasks</a>
            </div>
            <div id="today">
                <a href="#" id="today-link">Today</a>
            </div>
            <div id="weekly">
                <a href="#" id="weekly-link">This Week</a>
            </div>
            <div id="priority">
                <a href="#" id="priority-link">Priority</a>
            </div>
        </div>
        
        <div id="projects">
            <div id="add-project">
                <span>Create new project</span>
                <svg id="open-project-modal-btn" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" 
                    stroke-width="1.5" stroke="currentColor" class="icon">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
                </svg>
            </div>
            <div id="project-list"></div>
        </div>
        
        <button id="open-modal-btn">+</button>

    </div>


    

     <!-- The Modal (already present in your HTML) -->
     <div id="taskModal" class="modal">
         <div class="modal-content">
             <div class="modal-header">
                 <h2>Create New Task</h2>
                 <span class="close">&times;</span>
             </div>
             <div class="modal-body">
                 <form id="task-form">
                     <label for="task-title">Title:</label><br>
                     <input type="text" id="task-title" name="title" required><br><br>
 
                     <label for="task-description">Description:</label><br>
                     <textarea id="task-description" name="description"></textarea><br><br>
 
                     <label for="task-due-date">Due Date:</label><br>
                     <input type="date" id="task-due-date" name="dueDate"><br><br>
 
                     <label for="task-priority">Priority:</label><br>
                     <select id="task-priority" name="priority">
                         <option value="low">Low</option>
                         <option value="medium">Medium</option>
                         <option value="high">High</option>
                     </select><br><br>
                     <label for="task-project">Project</label>
                     <select id="task-project" name="task-project">
                         <option value="new">Create New Project</option>pontu
                         <!-- Dynamically add existing projects here -->
                     </select>
                     
                     <input type="text" id="new-project-name" placeholder="New Project Name" style="display:none;" /> 
                 </form>
             </div>
             <div class="modal-footer">
                 <button type="button" class="btn-secondary" id="cancel-btn">Cancel</button>
                 <button type="submit" class="btn-primary" form="task-form">Create Task</button>
             </div>
         </div>
     </div>

     <div id="projectModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Project</h2>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="project-form">
                    <label for="project-name">Project Name:</label><br>
                    <input type="text" id="project-name" name="project-name" required><br><br>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancel-project-btn">Cancel</button>
                <button type="submit" class="btn-primary" form="project-form">Create Project</button>
            </div>
        </div>
    </div>
    



</body>
</html>
